name: Werkdag registreren
description: Registreer gewerkte uren, pauze en werklocatie.
title: "[Log] "
labels: ["tijdregistratie"]
body:
  - type: input
    id: datum
    attributes:
      label: Datum
      description: Formaat JJJJ-MM-DD (bijv. 2026-11-11)
    validations:
      required: true
  - type: dropdown
    id: locatie
    attributes:
      label: Locatie
      options:
        - Thuis
        - Kantoor
        - Klant op locatie
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Startuur
      placeholder: "08:30"
    validations:
      required: true
  - type: input
    id: eind
    attributes:
      label: Einduur
      placeholder: "17:00"
    validations:
      required: true
  - type: input
    id: pauze
    attributes:
      label: Pauze (in minuten)
      placeholder: "30"
    validations:
      required: true
  - type: textarea
    id: omschrijving
    attributes:
      label: Omschrijving werkzaamheden
    validations:
      required: true
