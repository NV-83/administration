name: Werkdag registreren
description: Registreer gewerkte uren, pauze en werklocatie.
title: "Tijdsregistratie: "
labels: ["tijdsregistratie"]
assignees:
  - V3rmeulen
body:
  - type: input
    id: datum
    attributes:
      label: Datum
      description: Formaat JJJJ-MM-DD (bijv. 2026-11-11)
    validations:
      required: true

  - type: dropdown
    id: locatie
    attributes:
      label: Locatie
      options:
        - Thuis
        - Kantoor
        - Klant op locatie
    validations:
      required: true

  - type: input
    id: start
    attributes:
      label: Startuur
      placeholder: "08:30"
    validations:
      required: true

  - type: input
    id: eind
    attributes:
      label: Einduur
      placeholder: "17:00"
    validations:
      required: true

  - type: input
    id: pauze
    attributes:
      label: Pauze (in minuten)
      placeholder: "30"
    validations:
      required: true

  - type: input
    id: start_extra
    attributes:
      label: Startuur extra (optioneel)
      placeholder: "20:00"
    validations:
      required: false

  - type: input
    id: eind_extra
    attributes:
      label: Einduur extra (optioneel)
      placeholder: "22:00"
    validations:
      required: false

  - type: input
    id: pauze_extra
    attributes:
      label: Pauze extra (minuten, optioneel)
      placeholder: "0"
    validations:
      required: false

  - type: textarea
    id: omschrijving
    attributes:
      label: Omschrijving werkzaamheden
    validations:
      required: false
