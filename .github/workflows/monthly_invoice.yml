name: Maandelijkse Factuur

on:
  schedule:
    - cron: '0 7 1 * *' # 1e dag van de maand
  workflow_dispatch:

jobs:
  invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genereer factuur
        env:
          UURTARIEF: "85.00"   # Pas aan naar wens of zet in GitHub Secrets
          BTW_TARIEF: "21"
        run: python scripts/generate_invoice.py

      - name: Bewaar factuur
        uses: actions/upload-artifact@v4
        with:
          name: factuur-${{ github.run_number }}
          path: output/
