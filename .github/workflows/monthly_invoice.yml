name: Maandelijkse Factuur

on:
  schedule:
    - cron: '0 7 1 * *' # Elke 1e van de maand om 07:00 UTC
  workflow_dispatch:
    inputs:
      klant:
        description: 'Klant / dossier'
        required: true
        default: 'waso'
      maand:
        description: 'Te factureren maand (JJJJ-MM, bijv. 2026-11). Leeg laten voor vorige maand.'
        required: false
        default: ''
      factuur_nr:
        description: 'Factuurnummer forceren (leeg laten voor automatische teller 01, 02, ...)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genereer factuurdossier (Dagtarief)
        id: generate
        env:
          KLANT_NAAM: ${{ github.event.inputs.klant || 'waso' }}
          TARGET_MONTH: ${{ github.event.inputs.maand }}
          MANUAL_FACTUUR_NR: ${{ github.event.inputs.factuur_nr }}
          DAG_TARIEF: "650.00"
          BTW_TARIEF: "21"
        run: python scripts/generate_invoice.py

      - name: Commit en push factuur naar repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/facturatie/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Factuur gegenereerd: ${{ steps.generate.outputs.klant }} - factuur_${{ steps.generate.outputs.factuur_nr }}" && git push)

      - name: Bewaar bestanden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: factuur-${{ steps.generate.outputs.klant }}-${{ steps.generate.outputs.factuur_nr }}
          path: data/facturatie/