name: Verwerk Issue naar CSV

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  parse-and-log:
    if: contains(github.event.issue.labels.*.name, 'tijdregistratie')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Voeg toe aan CSV
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/parse_issue.py

      - name: Commit data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/uren.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uren toegevoegd via #${{ github.event.issue.number }}" && git push)

      - name: Sluit issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Verwerkt en opgeslagen in `data/uren.csv`."
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
